            tableName: hotel_images
            columns:
              - column:
                  name: hotel_id
                  valueNumeric: 1
              - column:
                  name: url
                  value: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=1600&q=80"
              - column:
                  name: caption
                  value: "Lobby arrival"
              - column:
                  name: sort_order
