databaseChangeLog:
  - changeSet:
      id: 005-polish-hotel-copy
      author: booka
      changes:
        - update:
            tableName: hotels
            columns:
              - column:
                  name: name
                  value: "Booka Grand Hotel"
              - column:
                  name: description
                  value: "A calm Yangon landmark with lagoon-edge gardens, polished service, and rooms tuned for rest — steps from the city’s quieter streets."
              - column:
                  name: address
                  value: "18 Inya Road, Kamayut"
              - column:
                  name: amenities
                  value: "WiFi, Pool, Gym, Restaurant, Spa, Parking, Concierge"
            where: id = 1
        - update:
            tableName: room_types
            columns:
              - column:
                  name: description
                  value: "Soft linens, city light, and a quiet workspace — ideal for two."
            where: id = 1
        - update:
            tableName: room_types
            columns:
              - column:
                  name: description
                  value: "Extra space, a soaking tub, and a brighter view for longer stays."
            where: id = 2

  - changeSet:
      id: 005-seed-hotel-images
