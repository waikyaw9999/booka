databaseChangeLog:
  - changeSet:
      id: 004-hotel-images
      author: booka
      changes:
        - createTable:
            tableName: hotel_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: caption
                  type: VARCHAR(500)
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: hotel_images
            baseColumnNames: hotel_id
            referencedTableName: hotels
            referencedColumnNames: id
            constraintName: fk_hotel_images_hotel
            onDelete: CASCADE

        - createIndex:
            tableName: hotel_images
            indexName: idx_hotel_images_hotel_sort
            columns:
              - column:
                  name: hotel_id
              - column:
                  name: sort_order

  - changeSet:
      id: 004-room-images
      author: booka
      changes:
        - createTable:
            tableName: room_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: room_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: url
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: caption
                  type: VARCHAR(500)
              - column:
                  name: sort_order
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: room_images
            baseColumnNames: room_id
            referencedTableName: rooms
            referencedColumnNames: id
            constraintName: fk_room_images_room
            onDelete: CASCADE

        - createIndex:
            tableName: room_images
            indexName: idx_room_images_room_sort
            columns:
              - column:
                  name: room_id
              - column:
                  name: sort_order
