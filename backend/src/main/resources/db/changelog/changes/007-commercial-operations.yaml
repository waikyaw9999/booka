databaseChangeLog:
  - changeSet:
      id: 007-commercial-operations
      author: booka
      changes:
        - addColumn:
            tableName: guests
            columns:
              - column:
                  name: nationality
                  type: VARCHAR(80)
              - column:
                  name: vip_tier
                  type: VARCHAR(16)
                  defaultValue: NONE
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: blacklisted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - addColumn:
            tableName: hotels
            columns:
              - column:
                  name: business_date
                  type: DATE
        - createTable:
            tableName: night_audits
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: business_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: occupancy_percent
                  type: DECIMAL(5, 1)
                  constraints:
                    nullable: false
              - column:
                  name: adr
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: revpar
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: room_revenue
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: payments
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: open_balance
                  type: DECIMAL(12, 2)
                  constraints:
                    nullable: false
              - column:
                  name: rooms_sold
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: sellable_rooms
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: in_house
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: arrivals
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: departures
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: no_shows
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(500)
              - column:
                  name: closed_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: night_audits
            columnNames: hotel_id, business_date
            constraintName: uq_night_audits_hotel_date
        - createTable:
            tableName: guest_requests
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: booking_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: VARCHAR(32)
                  constraints:
                    nullable: false
              - column:
                  name: note
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(16)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            tableName: guest_requests
            indexName: idx_guest_requests_hotel
            columns:
              - column:
                  name: hotel_id
              - column:
                  name: status
